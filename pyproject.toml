[project]
name = "llm-secret-triage"
version = "0.1.0"
description = "LLM triage layer that separates real credentials from false positives in secret-scanner findings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
secret-triage = "secret_triage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secret_triage"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
