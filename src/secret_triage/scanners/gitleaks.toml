# gitleaks' own rules look for high-entropy keys. On a file share the usual leak
# is a human password written next to its label, or inside a URL, which they
# miss: this file adds a rule for each on top of the defaults.
title = "secret-triage"

[extend]
useDefault = true

# the label (password, pwd, mdp, mot de passe...), up to 20 chars of filler for
# "MDP wifi :" or "Password for admin:", then = : => | or a tab, then the value.
# | and tab are table cells: "Password | Welcome1!" once the table is text.
# pwd, mdp and pass need a boundary in front, so bypass and cmdpath don't count
[[rules]]
id = "password-assignment"
description = "Password written next to its label"
regex = '''(?i)(?:passw(?:or)?d|passwort|mot.?de.?passe|(?:\b|_)(?:pwd|mdp|pass)\b)[\w .-]{0,20}?["']?\s*(?:=>|[:=|]|\t)\s*["']?([^\s"'`;,<>]{4,})'''
secretGroup = 1
keywords = ["pass", "pwd", "mdp"]

# scheme://user:password@host, as in postgres://admin:...@db or https://svc:...@intranet.
# no length floor: a one-letter value is the prefilter's to drop, not the rule's
[[rules]]
id = "url-credentials"
description = "Password inside a URL"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@"'<>]+:([^\s/@"'<>]+)@[\w.-]+'''
secretGroup = 1
keywords = ["://"]
